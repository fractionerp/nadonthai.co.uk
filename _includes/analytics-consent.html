<section class="analytics-consent" id="analytics-consent" aria-labelledby="analytics-consent-title" hidden>
  <div class="analytics-consent__copy">
    <h2 id="analytics-consent-title">Optional analytics cookies</h2>
    <p>We use Google Analytics to understand how visitors use our website and improve it. It only loads if you accept. Your choice is remembered on this browser for six months. <a href="{{ '/privacy-policy/#cookies' | relative_url }}">Read about cookies</a>.</p>
    <p id="analytics-consent-status" aria-live="polite"></p>
  </div>
  <div class="analytics-consent__actions">
    <button type="button" data-analytics-choice="accepted">Accept analytics</button>
    <button type="button" data-analytics-choice="rejected">Reject analytics</button>
  </div>
</section>
